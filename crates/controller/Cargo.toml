[package]
name = "goblins-controller"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "goblins"
path = "src/main.rs"

[dependencies]
libc = "=0.2.186"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblins-protocol = { path = "../protocol" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
clap = { version = "4.6.6", features = ["derive", "string"] }
clap_complete = "4.6.9"
vt100 = "0.16"
