[package]
name = "goblins-controller"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "goblins"
path = "src/main.rs"

[dependencies]
libc = "=0.2.186"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblins-runtime = { path = "../../libs/runtime" }
goblins-supervisor = { path = "../../libs/supervisor" }
goblins-unix = { path = "../../libs/unix" }
goblins-protocol = { path = "../../libs/api" }
goblins-jsonrpc = { path = "../../libs/jsonrpc" }
goblins-init = { path = "../../libs/init" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
clap = { version = "4.6.6", features = ["derive", "string"] }
clap_complete = "4.6.9"

[dev-dependencies]
goblins-runtime = { path = "../../libs/runtime", features = ["test-support"] }
goblins-unix = { path = "../../libs/unix", features = ["test-support"] }
