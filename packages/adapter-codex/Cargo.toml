[package]
name = "goblins-codex"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
goblins-protocol = { path = "../../libs/api" }
goblins-jsonrpc = { path = "../../libs/jsonrpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.6", features = ["derive"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
libc = "0.2"
toml = "0.9"
